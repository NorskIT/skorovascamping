name: Deploy Beta
run-name: Deploy beta from ${{ github.ref_name }}

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-worker.yml
    with:
      target: beta
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
